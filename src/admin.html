<style>
/* // CSS NAME: perks-fonts // */
@font-face{font-family:"Work Sans";font-weight:500;font-display:swap;src:url(data:font/woff2;base64,__WS500__) format("woff2")}
@font-face{font-family:"Work Sans";font-weight:700;font-display:swap;src:url(data:font/woff2;base64,__WS700__) format("woff2")}
@font-face{font-family:"Work Sans";font-weight:900;font-display:swap;src:url(data:font/woff2;base64,__WS900__) format("woff2")}

/* // CSS NAME: perks-tokens // */
:root{--mint:#4ECAC2;--teal:#00ADBC;--deep:#1b8a9f;--ink:#123B4A;--ink2:#43484A;--ink3:#737778;--line:#E3E8E9;--bg:#F4F8F8;--paper:#fff;--ok:#1f8a5b;--warn:#b26a00;--bad:#b3261e;
--disp:"Work Sans","Arial Black",system-ui,sans-serif;--text:"Work Sans",system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:500 15px/1.5 var(--text)}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--disp);font-weight:900;text-transform:uppercase;margin:0;line-height:1.05;letter-spacing:.01em}
h1{font-size:26px}h2{font-size:17px}h3{font-size:14px}
a{color:var(--deep)}

/* // CSS NAME: perks-layout // */
.app{display:grid;grid-template-columns:236px 1fr;min-height:100vh}
.side{background:var(--ink);color:#fff;padding:18px 14px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;flex-direction:column;gap:6px;padding:4px 8px 16px}
.brand img{display:block}
.brand small{font-size:11px;opacity:.7;letter-spacing:.08em;text-transform:uppercase}
.nav button{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;font-weight:700;font-size:14px;color:#d8e6e9;width:100%;box-sizing:border-box}
.nav button:hover{background:rgba(255,255,255,.07);color:#fff}
.nav button.on{background:var(--mint);color:#fff}
.nav .cnt{margin-left:auto;background:#fff;color:var(--ink);border-radius:20px;font-size:11px;padding:0 7px;line-height:18px}
.nav .sep{font-size:11px;opacity:.55;letter-spacing:.1em;text-transform:uppercase;padding:14px 10px 4px}
.main{min-width:0}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 28px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5;flex-wrap:wrap}
.top .who{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--ink2)}
/* // CSS NAME: perks-portal-venue-logo // */
.top .who .vlogo{width:44px;height:44px;border-radius:50%;object-fit:cover;background:#fff;border:1px solid var(--line,#e5e7eb);margin-left:6px}
.wrap{padding:24px 28px 60px;display:flex;flex-direction:column;gap:20px;max-width:1280px}
.asbar{background:var(--deep);color:#fff;padding:10px 28px;display:flex;gap:12px;align-items:center;justify-content:space-between;font-weight:700;font-size:14px;flex-wrap:wrap}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.g6{grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
@media(max-width:860px){.app{grid-template-columns:1fr}.side{position:static;height:auto;flex-direction:row;flex-wrap:wrap}.brand{padding:4px 8px}.nav{display:flex;flex-wrap:wrap;gap:4px}.nav button{width:auto}.nav .sep{display:none}.wrap,.top{padding-left:16px;padding-right:16px}}

/* // CSS NAME: perks-cards // */
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card .hd{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.kpi{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.kpi b{display:block;font-family:var(--disp);font-weight:900;font-size:26px;line-height:1.1}
.kpi span{font-size:12px;color:var(--ink3);text-transform:uppercase;letter-spacing:.06em;font-weight:700}
.kpi i{font-style:normal;font-size:12px;color:var(--ink3)}
.muted{color:var(--ink3);font-size:13px}
.note{background:#E8F7F6;border:1px solid #BFE9E5;border-radius:12px;padding:10px 14px;font-size:13px;color:var(--ink)}
.warnbox{background:#FFF6E5;border:1px solid #F3D9A4;border-radius:12px;padding:10px 14px;font-size:13px}

/* // CSS NAME: perks-buttons // */
.btn{all:unset;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--ink);color:#fff;font-weight:700;font-size:13px;padding:9px 14px;border-radius:10px;white-space:nowrap;box-sizing:border-box}
.btn:hover{background:#0b2a36}
.btn.mint{background:var(--mint)}.btn.mint:hover{background:var(--deep)}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}.btn.ghost:hover{border-color:var(--ink)}
.btn.sm{padding:6px 10px;font-size:12px;border-radius:8px}
.btn.danger{background:#fff;color:var(--bad);border:1px solid #f0c9c6}.btn.danger:hover{background:#fdf0ef}
.btn:focus-visible,.nav button:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:2px 8px;border-radius:20px;background:#EEF2F3;color:var(--ink2);white-space:nowrap}
.chip.live{background:#E3F5EC;color:var(--ok)}.chip.pending{background:#FFF1D6;color:var(--warn)}.chip.bad{background:#FBE6E4;color:var(--bad)}.chip.mint{background:#E0F6F4;color:var(--deep)}

/* // CSS NAME: perks-forms // */
label.f{display:flex;flex-direction:column;gap:5px;font-size:12px;font-weight:700;color:var(--ink2);text-transform:uppercase;letter-spacing:.05em}
input.i,select.i,textarea.i{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 11px;background:#fff;font-size:14px;text-transform:none;letter-spacing:0;font-weight:500;color:var(--ink)}
textarea.i{min-height:84px;resize:vertical}
input.i:focus,select.i:focus,textarea.i:focus{outline:2px solid var(--mint);border-color:var(--mint)}
.toggle{position:relative;width:40px;height:22px;flex:none}
.toggle input{opacity:0;width:0;height:0}
.toggle span{position:absolute;inset:0;background:#cfd6d8;border-radius:20px;cursor:pointer;transition:.2s}
.toggle span:before{content:"";position:absolute;width:16px;height:16px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s}
.toggle input:checked+span{background:var(--mint)}
.toggle input:checked+span:before{transform:translateX(18px)}

/* // CSS NAME: perks-tables // */
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink3);padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:hover td{background:#FAFCFC}
.tw{overflow:auto;border:1px solid var(--line);border-radius:14px;background:#fff}
.av{width:34px;height:34px;border-radius:9px;background:var(--mint);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-weight:900;font-size:13px;flex:none;overflow:hidden;position:relative}
.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#fff}
.bar{height:7px;background:#EAEFF0;border-radius:6px;overflow:hidden;min-width:70px}
.bar i{display:block;height:100%;background:var(--mint)}
.bar.lo i{background:#E3A23B}.bar.vlo i{background:#D9534F}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tabs button{all:unset;cursor:pointer;padding:9px 14px;font-weight:700;font-size:13px;color:var(--ink3);border-bottom:3px solid transparent}
.tabs button.on{color:var(--ink);border-color:var(--mint)}

/* // CSS NAME: perks-ring // */
.ring{display:flex;gap:18px;align-items:center}
.ring svg{flex:none}
.check{display:flex;flex-direction:column;gap:6px}
.check div{display:flex;gap:10px;align-items:center;font-size:14px}
.tick{width:20px;height:20px;border-radius:50%;flex:none;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:900;color:#fff;background:var(--mint)}
.tick.no{background:#fff;border:2px solid #cfd6d8}

/* // CSS NAME: perks-modal // */
.ov{position:fixed;inset:0;background:rgba(18,59,74,.45);display:flex;align-items:flex-start;justify-content:center;padding:6vh 16px;z-index:50;overflow:auto}
.md{background:#fff;border-radius:18px;width:min(560px,100%);padding:22px;display:flex;flex-direction:column;gap:14px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.md.wide{width:min(820px,100%)}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 18px;border-radius:12px;font-weight:700;font-size:14px;z-index:60;box-shadow:0 8px 30px rgba(0,0,0,.2)}
.eway{border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px;background:#FBFDFD}
.eway .lock{font-size:12px;color:var(--ink3);display:flex;gap:6px;align-items:center}

/* // CSS NAME: perks-email-preview // */
.mail{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#fff}
.mail .mh{background:var(--mint);color:#fff;padding:18px 22px}
.mail .mh img{width:96px;display:block;margin-bottom:6px}
.mail .mb{padding:20px 22px;display:flex;flex-direction:column;gap:12px;font-size:15px}
.mail .mf{padding:12px 22px;font-size:11px;color:var(--ink3);border-top:1px solid var(--line)}
.meta{font-size:12px;color:var(--ink3);padding:10px 14px;border-bottom:1px solid var(--line);background:#FAFCFC}

/* // CSS NAME: perks-phone-preview // */
.push{background:#1d1f22;border-radius:22px;padding:16px;color:#fff;max-width:320px}
.push .n{background:rgba(255,255,255,.14);border-radius:14px;padding:10px 12px;display:flex;gap:10px}
.push .ic{width:30px;height:30px;border-radius:8px;background:var(--mint);flex:none;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:11px}

/* // CSS NAME: perks-login // */
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--mint);padding:24px}
.login .box{background:#fff;border-radius:22px;padding:30px;width:min(440px,100%);display:flex;flex-direction:column;gap:14px}
.mbars{display:flex;gap:6px;align-items:flex-end;height:90px}
.mbars div{flex:1;background:var(--mint);border-radius:5px 5px 0 0;position:relative;min-height:2px}
.mbars div span{position:absolute;bottom:-18px;left:0;right:0;text-align:center;font-size:10px;color:var(--ink3)}
.mbars div em{position:absolute;top:-17px;left:0;right:0;text-align:center;font-size:10px;font-style:normal;color:var(--ink2);font-weight:700}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.thumbs .t{width:92px;height:70px;border-radius:10px;background:#E6EEEF center/cover;position:relative;overflow:hidden;border:1px solid var(--line)}
.thumbs .t img{width:100%;height:100%;object-fit:cover}
.thumbs .t button{position:absolute;top:3px;right:3px;width:20px;height:20px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:12px;cursor:pointer;line-height:20px;padding:0}
.drop{border:2px dashed #BFD6D9;border-radius:12px;padding:14px;text-align:center;color:var(--ink3);font-size:13px;cursor:pointer;background:#FAFCFC}
/* // CSS NAME: perks-admin-login-logo // */
.login .box h1{text-align:center}
.login .box>.muted{text-align:center}
/* // CSS NAME: perks-admin-login-lockup // */
.byline{order:2;display:flex;align-items:center;gap:5px;align-self:flex-end;margin-top:2px}
.byline span{font-family:var(--text);font-weight:600;font-size:10px;line-height:1;color:#fff;opacity:.9}
.byline img{width:52px;display:block}
.lockup{order:1;position:relative;width:100%;height:44px;margin:0}
.lockup .lk{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;opacity:0;overflow:visible;animation-duration:13s;animation-iteration-count:infinite;animation-delay:var(--d)}
.lockup .lk.short{animation-name:lkShort}
.lockup .lk.long{animation-name:lkLong}
.lockup svg{display:block;overflow:visible;width:auto;height:38px;flex-shrink:0}
.lockup .plain{position:relative;display:block;animation:slide 13s infinite;animation-delay:var(--d)}
.lockup .stamp{position:relative;display:block;transform-origin:50% 60%;animation:stamp 13s infinite;animation-delay:var(--d)}
.sun{position:absolute;right:-20px;top:-14px;width:40px;height:40px;opacity:0;animation:sun 13s infinite;animation-delay:var(--d)}
.sun svg{width:40px!important;height:40px!important;filter:drop-shadow(0 0 5px rgba(255,213,74,.45))}
@keyframes lkShort{0%{opacity:0}2.3%,11.9%{opacity:1}13.8%,100%{opacity:0}}
@keyframes lkLong{0%{opacity:0}2.3%,47.7%{opacity:1}50.8%,100%{opacity:0}}
@keyframes slide{0%{transform:translateY(10px)}2.3%,11.9%{transform:none}13.8%,100%{transform:translateY(-8px)}}
@keyframes stamp{0%{transform:scale(1.6) rotate(-9deg)}2.3%{transform:scale(.94) rotate(-2deg)}3.8%{transform:scale(1.03) rotate(-3deg)}5.4%,47.7%{transform:scale(1) rotate(-3deg)}50.8%,100%{transform:scale(.96) rotate(-3deg)}}
@keyframes sun{0%,3.1%{opacity:0;transform:translateY(14px) scale(.4) rotate(0)}6.9%{opacity:1;transform:translateY(0) scale(1.1) rotate(40deg)}10%{opacity:1;transform:scale(1) rotate(60deg)}46.9%{opacity:1;transform:scale(1) rotate(200deg)}50%,100%{opacity:0;transform:scale(.8) rotate(220deg)}}
.top{position:relative}
.rays{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.rays::before{animation-delay:var(--rd,0s)!important;content:"";position:absolute;left:50%;top:60%;width:900px;height:900px;margin:-450px 0 0 -450px;background:repeating-conic-gradient(rgba(255,255,255,.10) 0 9deg,transparent 9deg 18deg);animation:spin 60s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.lockup,.byline,.seg{position:relative;z-index:1}
@media (prefers-reduced-motion:reduce){.lockup .lk,.lockup .stamp,.lockup .plain,.sun,.rays::before{animation:none}.lockup .lk.long{opacity:1}.sun{opacity:1}}
.login-logo{position:relative;overflow:hidden;background:#4ECAC2;border-radius:14px;padding:22px 18px 12px;display:flex;flex-direction:column;align-items:stretch}
.login-logo .lockup{height:52px}
.login-logo .lockup svg{height:42px;max-width:100%}
.login-logo .byline{align-self:center;margin-top:8px}

/* // CSS NAME: perks-admin-back // */
.nav .backadm{background:#4ECAC2;color:#fff;font-weight:900;margin:0 6px 10px;border-radius:10px}
</style>

<body>
<div id="root"></div>
<script>
const D=__DATA__;
const LOGO_WHITE='data:image/png;base64,__LOGO__';
function bigWord(word){
  const W=Math.round(word.length*92), t=(x,y,e)=>`<text x="${W/2+x}" y="${y}" text-anchor="middle" font-family="Work Sans, sans-serif" font-weight="900" font-size="130" ${e}>${word}</text>`;
  return `<svg class="wide" viewBox="0 0 ${W} 110" role="img" aria-label="${word}">${t(9,109,'fill="#123B4A" stroke="#123B4A" stroke-width="16" stroke-linejoin="round"')}${t(0,100,'fill="#123B4A" stroke="#123B4A" stroke-width="16" stroke-linejoin="round"')}${t(0,100,'fill="#FFFFFF"')}</svg>`;
}
/* one big Aussie sun behind PERKS */
const SPARK = `<span class="sun" aria-hidden="true"><svg viewBox="0 0 48 48" width="40" height="40"><g stroke="#FFD54A" stroke-opacity=".55" stroke-width="5.6" stroke-linecap="round"><path d="M24 3v7M24 38v7M3 24h7M38 24h7M9.2 9.2l5 5M33.8 33.8l5 5M9.2 38.8l5-5M33.8 14.2l5-5"/></g><g stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"><path d="M24 3v7M24 38v7M3 24h7M38 24h7M9.2 9.2l5 5M33.8 33.8l5 5M9.2 38.8l5-5M33.8 14.2l5-5"/></g><circle cx="24" cy="24" r="9.6" fill="#FFF8DC" stroke="#FFD54A" stroke-opacity=".7" stroke-width="2"/></svg></span>`;
const T0=performance.now(); const HPHASE=()=>((performance.now()-T0)/1000)%13;
const LOCKUP = () => `<span class="rays" aria-hidden="true" style="--rd:-${(((performance.now()-T0)/1000)%60).toFixed(2)}s"></span><div class="byline"><span>by</span><img src="${LOGO_WHITE}" alt="ULTIMATE"></div>
  <div class="lockup" role="img" aria-label="East Coast Australia Traveller Perks">
  ${['EAST COAST','AUSTRALIA','TRAVELLER','PERKS'].map((w,i)=>`<div class="lk ${w==='PERKS'?'long':'short'}" style="--d:${(i*1.8-HPHASE()).toFixed(2)}s" aria-hidden="true"><span class="${w==='PERKS'?'stamp':'plain'}">${w==='PERKS'?SPARK:''}${bigWord(w)}</span></div>`).join('')}</div>`;
const DOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const TOWN=k=>(D.towns[k]||{}).name||k;
const TOWNS=Object.keys(D.towns);
const DAY=864e5, NOW=Date.now();
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>(n<0?'-':'')+'$'+Math.abs(n).toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g,',');
const fmt=d=>d?new Date(d).toLocaleDateString('en-AU',{day:'numeric',month:'short',year:'numeric'}):'—';
const fmtT=d=>new Date(d).toLocaleString('en-AU',{day:'numeric',month:'short',hour:'numeric',minute:'2-digit'});
const daysTo=d=>Math.ceil((d-NOW)/DAY);
const initials=n=>n.replace(/[^A-Za-z ]/g,'').split(' ').filter(Boolean).slice(0,2).map(w=>w[0]).join('').toUpperCase();
let seed=11;const rnd=()=>(seed=(seed*16807)%2147483647,(seed-1)/2147483646);
const pick=a=>a[Math.floor(rnd()*a.length)];
const uid=p=>p+Math.random().toString(36).slice(2,8).toUpperCase();
const store={get(){try{return JSON.parse(localStorage.getItem('perksPortal_v4'))}catch(e){return null}},set(v){try{localStorage.setItem('perksPortal_v4',JSON.stringify(v))}catch(e){toast('Browser storage is full. Changes stay until you reload.')}}};

const parseCSV=s=>{const out=[];let row=[],f='',q=false;for(let i=0;i<s.length;i++){const c=s[i];if(q){if(c==='"'){if(s[i+1]==='"'){f+='"';i++}else q=false}else f+=c}else if(c==='"')q=true;else if(c===','){row.push(f);f=''}else if(c==='\n'||c==='\r'){if(c==='\r'&&s[i+1]==='\n')i++;row.push(f);out.push(row);row=[];f=''}else f+=c}if(f||row.length){row.push(f);out.push(row)}return out.filter(r=>r.some(x=>x.trim()))};
const detectProv=c=>/rezdy/i.test(c)?'Rezdy':/fareharbor/i.test(c)?'FareHarbor':/bokun/i.test(c)?'Bokun':/checkfront/i.test(c)?'Checkfront':/trekksoft/i.test(c)?'TrekkSoft':/peek/i.test(c)?'Peek':/xola/i.test(c)?'Xola':c?'Other widget':'';
const trackLink=v=>`https://perks.ultimate.travel/go/${v.id}`;
/* ---------- sample data (clearly sample) ---------- */
function seedData(){
  seed=11;
  const settings={listing:299,featuredWeek:79,push:99,extraLocation:99,offerPack:49,promos:[{code:'PERKS6FREE',months:6,uses:3,active:true,note:'Free 6-month listing'}],gstIncl:true,ewayMode:'Sandbox',ewayKey:'',ewayPass:'',ewayPublic:'',reviews:true,fromEmail:'perks@ultimate.travel',admins:[{n:'Steve',e:'steven@ultimate.travel',role:'Owner'}]};
  const venues=D.perks.map((p,i)=>{
    const lvl=[1,.9,.5,.8,.7,1,.4,.6,.9,.3,.8,.6,1,.5,.7,.4,.9,1,.6,.8,.5,.7][i%22];
    const statuses={5:'pending',9:'expired',15:'draft'};
    const exp=NOW+Math.round((rnd()*420-50))*DAY;
    const hours={};(p.hours||[]).forEach(([ds,o,c])=>ds.forEach(d=>hours[d]=[o,c]));
    const v={id:String(p.id),name:p.name,town:p.town,cat:p.cat,addr:p.addr,lat:p.lat,lon:p.lon,
      logo:lvl>.35?p.logo:'',photos:(p.photos&&p.photos.length?p.photos:[p.photo]).filter(Boolean).slice(0,lvl>.75?6:lvl>.45?2:1),

/* ---------- profile completeness ---------- */
function comp(v){
  const live=v.offers.filter(o=>!o.paused);
  const items=[
    {k:'logo',l:'Upload your logo',done:!!v.logo,p:'profile'},
    {k:'photos',l:'Add at least 3 photos',done:v.photos.length>=3,p:'profile'},
    {k:'desc',l:'Write a short description (40+ characters)',done:(v.desc||'').length>=40,p:'profile'},
    {k:'addr',l:'Confirm your address and map pin',done:!!v.addr&&!!v.lat,p:'profile'},
    {k:'hours',l:'Set your real opening hours',done:v.hoursReal&&Object.keys(v.hours).length>0,p:'profile'},
    {k:'offer',l:'Have at least one live offer',done:live.length>0,p:'offers'},
    {k:'terms',l:'Add terms to every offer',done:live.length>0&&live.every(o=>(o.terms||'').length>3),p:'offers'},
    {k:'phone',l:'Add a phone number',done:!!v.phone,p:'profile'},
    {k:'web',l:'Add a website or booking link',done:!!(v.web||v.book),p:'profile'},
    {k:'card',l:'Save a card so your listing renews',done:!!v.card,p:'billing'}];
  const pct=Math.round(items.filter(i=>i.done).length/items.length*100);
  return{pct,items,missing:items.filter(i=>!i.done)};
}

    renewal:`<p style="margin:0">Your Traveller Perks listing for ${esc(v.name)} ends on <b>${fmt(v.expires)}</b>.</p><p style="margin:0">${v.card&&v.autoRenew?`It renews automatically on your ${v.card.brand} ending ${v.card.last4} for ${money(DB.settings.listing)}. Nothing to do.`:`Renew now so you stay in the app. ${money(DB.settings.listing)} for 12 months.`}</p>${btn(v.card&&v.autoRenew?'Manage billing':'Renew my listing')}`,
    expired:`<p style="margin:0">${esc(v.name)} is no longer showing to travellers. Renew to switch it straight back on. Your photos and offers are all saved.</p>${btn('Renew for '+money(DB.settings.listing))}`,
    card:`<p style="margin:0">We couldn't charge your card for ${esc(v.name)}. Update it in a minute so your listing doesn't lapse.</p>${btn('Update my card')}`,
    boost:`<p style="margin:0">Your Featured boost for ${esc(v.name)} is booked. You'll show at the top of the Perks home screen and the ${esc(TOWN(v.town))} page.</p>${btn('See my boosts')}`};
  return`<div class="mail"><div class="meta">From: Traveller Perks &lt;${esc(DB.settings.fromEmail)}&gt; · To: ${esc(v.contact.e)}<br><b>Subject: ${esc(subj)}</b></div><div class="mh"><img src="${LOGO_WHITE}" alt="ULTIMATE"><b style="font:900 20px Work Sans;letter-spacing:.02em">TRAVELLER PERKS</b></div><div class="mb">${bodies[k]||''}</div><div class="mf">Traveller Perks by Ultimate · perks.ultimate.travel · <a href="#">Email settings</a></div></div>`;
}

/* ---------- VENUE PAGES ---------- */
const VNAV=[['dash','Dashboard'],['profile','Venue profile'],['offers','Offers + flash deals'],['boost','Boost: featured + push'],['bookings','Bookings in the app'],['redeem','Check a voucher'],['locations','Locations'],['billing','Billing'],['emails','Email settings']];
function vPage(){const v=cv();if(!v)return'<div class="card">Venue not found.</div>';const c=comp(v);
  switch(S.page){
  case 'dash':{const live=v.status==='live';return`
    ${c.pct<100?`<div class="card" style="border-color:#BFE9E5"><div class="ring">${ring(c.pct)}<div style="display:flex;flex-direction:column;gap:6px"><h2>Your profile is ${c.pct}% complete</h2><div class="muted">Finish ${c.missing.length===1?'this last step':'these '+c.missing.length+' steps'} and you'll show up properly in the app. Complete profiles get more taps.</div><div class="row">${c.missing.slice(0,4).map(i=>`<button class="btn sm ghost" data-act="go" data-p="${i.p}">${esc(i.l)}</button>`).join('')}</div></div></div></div>`:`<div class="note">Your profile is 100% complete. Nice.</div>`}
    ${v.status==='pending'?'<div class="warnbox">Your venue is waiting for approval by the Perks team. We usually check within 1 business day.</div>':''}
    ${v.status==='expired'?`<div class="warnbox row" style="justify-content:space-between"><span><b>Your listing has ended.</b> Travellers can't see ${esc(v.name)} right now.</span><button class="btn sm" data-act="renew">Renew for ${money(DB.settings.listing)}</button></div>`:''}
    <div class="grid g6">
      <div class="kpi"><span>Views · 30 days</span><b>${v.stats.views.toLocaleString()}</b></div>
      <div class="kpi"><span>Saves</span><b>${v.stats.saves}</b></div>
      <div class="kpi"><span>Perks used</span><b>${v.stats.uses}</b></div>
      <div class="kpi"><span>Travellers in town now</span><b>${inTown(v.town)}</b><i>+${arriving(v.town)} arriving this week</i></div></div>
    <div class="grid g2">
      <div class="card"><div class="hd"><h2>Your listing</h2>${chip(v.status)}</div>
        <div>Shows in the app until <b>${fmt(v.expires)}</b> ${expChip(v.expires)}</div>
        <div class="muted">${v.card?`${v.autoRenew?'Renews automatically':'Auto-renew is off'} · ${v.card.brand} •• ${v.card.last4}`:'No card saved. Add one so your listing doesn\'t drop off.'}</div>
        <div class="row"><button class="btn" data-act="renew">Renew now</button><button class="btn ghost" data-act="go" data-p="billing">Billing</button></div></div>
      <div class="card"><div class="hd"><h2>Get more travellers in</h2></div>
        <div class="row"><button class="btn mint" data-act="go" data-p="boost">Feature my venue</button><button class="btn ghost" data-act="flash">Add a flash deal</button><button class="btn ghost" data-act="go" data-p="boost">Send a push</button></div>
        <div class="muted">${v.featuredUntil>NOW?`Featured until ${fmt(v.featuredUntil)}.`:'Not featured right now. Featured venues sit at the top of the Perks home screen.'}</div>${v.brandId?'':`<button class="btn sm ghost" data-act="go" data-p="locations" style="align-self:flex-start">I'm in multiple locations</button>`}</div></div>
    <div class="card"><div class="hd"><h2>Perks used per month</h2></div>${monthBars(v.stats.months)}</div>`}
  case 'profile':return`
    <div class="card"><div class="ring">${ring(c.pct,72)}<div><h2>${c.pct}% complete</h2><div class="muted">${c.missing.length?'Still to do: '+c.missing.map(i=>i.l.toLowerCase()).join(', ')+'.':'All done.'}</div></div></div></div>
    <div class="grid g2">
    <div class="card"><h2>Logo and photos</h2>
      <div class="row" style="gap:14px;align-items:flex-start"><div style="width:96px;height:96px;border-radius:16px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;overflow:hidden;background:#fff;flex:none">${v.logo?`<img src="${esc(v.logo)}" alt="${esc(v.name)} logo" style="max-width:100%;max-height:100%" onerror="this.replaceWith(document.createTextNode('${esc(initials(v.name))}'))">`:'<span class="muted">No logo</span>'}</div>
      <div style="display:flex;flex-direction:column;gap:6px"><label class="btn sm ghost">Upload logo<input type="file" accept="image/*" data-up="logo" hidden></label>${v.logo?'<button class="btn sm danger" data-act="rmlogo">Remove</button>':''}<span class="muted">Square PNG or JPG, at least 400px. Required to go live.</span></div></div>
      <div class="thumbs">${v.photos.map((p,i)=>`<div class="t"><img src="${esc(p)}" alt="Photo ${i+1}" onerror="this.style.display='none'"><button aria-label="Remove photo ${i+1}" data-act="rmphoto" data-i="${i}">×</button></div>`).join('')}</div>

      <div class="muted">Only upload photos you own or have permission to use.</div></div>
    <div class="card"><h2>About your venue</h2>
      <label class="f">Venue name<input class="i" data-f="name" value="${esc(v.name)}"></label>
      <div class="row" style="flex-wrap:nowrap"><label class="f" style="flex:1">Category<select class="i" data-f="cat">${['Bar','Restaurant','Cafe','Activity','Shop','Free'].map(x=>`<option ${x===v.cat?'selected':''}>${x}</option>`).join('')}</select></label>
      <label class="f" style="flex:1">Town<select class="i" data-f="town">${TOWNS.map(t=>`<option value="${t}" ${t===v.town?'selected':''}>${esc(TOWN(t))}</option>`).join('')}</select></label></div>
      <label class="f">Description<textarea class="i" data-f="desc" placeholder="What's it like, what should travellers order, when is it best?">${esc(v.desc)}</textarea></label>

      <div class="row" style="flex-wrap:nowrap"><label class="f" style="flex:1">Phone<input class="i" data-f="phone" value="${esc(v.phone)}"></label><label class="f" style="flex:1">Instagram<input class="i" data-f="insta" value="${esc(v.insta)}" placeholder="@yourvenue"></label></div>
      <label class="f">Website<input class="i" data-f="web" value="${esc(v.web)}" placeholder="https://"></label>
      <label class="f">Booking link (optional)<input class="i" data-f="book" value="${esc(v.book)}" placeholder="https://"></label></div>
    <div class="card"><div class="hd"><h2>Opening hours</h2>${v.hoursReal?'<span class="chip live">Confirmed</span>':'<span class="chip pending">Not confirmed</span>'}</div>
      <div class="muted">The app shows "Open now" from these, in your local time.</div>
      ${[1,2,3,4,5,6,0].map(d=>{const h=v.hours[d];return`<div class="row" style="flex-wrap:nowrap"><b style="width:44px">${DOW[d]}</b><input class="i" type="time" data-h="${d}" data-w="0" value="${h?h[0]:''}" ${h?'':'disabled'} style="max-width:130px"><span>to</span><input class="i" type="time" data-h="${d}" data-w="1" value="${h?h[1]:''}" ${h?'':'disabled'} style="max-width:130px"><label class="row" style="gap:6px;font-size:13px"><input type="checkbox" data-closed="${d}" ${h?'':'checked'}> Closed</label></div>`}).join('')}
      <button class="btn sm" data-act="confirmhours" style="align-self:flex-start">These hours are right</button></div>
    <div class="card"><h2>Contact for Perks emails</h2>
      <label class="f">Name<input class="i" data-c="n" value="${esc(v.contact.n)}"></label>
      <label class="f">Email<input class="i" data-c="e" type="email" value="${esc(v.contact.e)}"></label>
      <div class="muted">Reminders, receipts and monthly stats go here.</div></div></div>`;
  case 'offers':return`
    <div class="card"><div class="hd"><div><h2>Your offers</h2><div class="muted">${standingOffers(cv())} of ${offerCap(cv())} offers used${standingOffers(cv())>=offerCap(cv())?` · <a href="#" data-act="offerpack">Add 3 more for ${money(DB.settings.offerPack)}/yr</a>`:''}</div></div><div class="row"><button class="btn ghost" data-act="flash">Flash deal</button><button class="btn" data-act="offer">+ Add offer</button></div></div>
    <div class="muted">Each offer gets its own Use button in the app. Set days and times if it only runs some of the week.</div>
    ${v.offers.map(o=>`<div style="border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;gap:12px;justify-content:space-between;flex-wrap:wrap">
      <div style="min-width:0;flex:1"><div class="row"><b>${esc(o.t)}</b>${o.flashUntil>NOW?`<span class="chip mint">Flash until ${fmtT(o.flashUntil)}</span>`:''}${o.paused?'<span class="chip pending">Paused</span>':'<span class="chip live">Live</span>'}</div>
      <div class="muted">${esc(o.terms||'No terms yet')}${o.when?` · ${o.when[0].map(d=>DOW[d]).join(', ')} ${o.when[1]}–${o.when[2]}`:' · Any time we\'re open'}</div></div>
      <div class="row"><button class="btn sm ghost" data-act="offer" data-id="${o.id}">Edit</button><button class="btn sm ghost" data-act="pause" data-id="${o.id}">${o.paused?'Resume':'Pause'}</button><button class="btn sm danger" data-act="deloffer" data-id="${o.id}">Delete</button></div></div>`).join('')||'<div class="muted">No offers yet.</div>'}</div>`;
  case 'boost':{const mine=DB.pushes.filter(p=>p.vid===v.id);const st=DB.settings;return`
    <div class="grid g2">
    <div class="card"><div class="hd"><h2>Featured</h2>${v.featuredUntil>NOW?`<span class="chip mint">Until ${fmt(v.featuredUntil)}</span>`:''}</div>
      <div>Sit at the top of the Perks home screen and the ${esc(TOWN(v.town))} page. ${money(st.featuredWeek)} per week.</div>
      <label class="f">How long<select class="i" id="fw">${[1,2,4,8].map(w=>`<option value="${w}">${w} week${w>1?'s':''} · ${money(st.featuredWeek*w)}</option>`).join('')}</select></label>
      <button class="btn mint" data-act="buyfeat" style="align-self:flex-start">Feature my venue</button></div>
    <div class="card"><h2>Push notification</h2>
      <div>Send one notification to travellers' phones. ${money(st.push)} per send. The Perks team checks every push before it goes out.</div>
      <label class="f">Headline (40 max)<input class="i" id="pt" maxlength="40" placeholder="2-for-1 cocktails tonight"></label>
      <label class="f">Message (120 max)<textarea class="i" id="pb" maxlength="120" placeholder="Show the app at the bar. Until 9pm."></textarea></label>
      <label class="f">Who gets it<select class="i" id="pa"><option value="in:${v.town}">Travellers in ${esc(TOWN(v.town))} now (${inTown(v.town)})</option><option value="arr:${v.town}">Arriving in ${esc(TOWN(v.town))} in the next 7 days (${arriving(v.town)})</option><option value="saved:${v.id}">Travellers who saved ${esc(v.name)}</option></select></label>
      <label class="f">When<input class="i" type="datetime-local" id="pw"></label>
      <button class="btn mint" data-act="buypush" style="align-self:flex-start">Pay ${money(st.push)} and send for approval</button></div></div>
    <div class="card"><h2>Your pushes</h2>${mine.length?`<div class="tw"><table class="tbl"><tr><th>Headline</th><th>When</th><th>Status</th><th>Reached</th><th>Opened</th></tr>${mine.map(p=>`<tr><td>${esc(p.title)}</td><td>${fmtT(p.when)}</td><td>${chip(p.status)}</td><td>${p.reach||'—'}</td><td>${p.opens||'—'}</td></tr>`).join('')}</table></div>`:'<div class="muted">None yet.</div>'}</div>`}
  case 'bookings':{const b=v.booking,s=v.bstats,conv=s.opens?s.bookings/s.opens*100:0;return`
    <div class="note">Tours and activities can take bookings straight from the app. Travellers tap <b>Book now</b> on your perk and we track every tap, every booking page opened and every confirmed booking, so you can see exactly what Perks brings in.</div>
    <div class="grid g6"><div class="kpi"><span>Book now taps</span><b>${s.taps}</b></div><div class="kpi"><span>Booking page opened</span><b>${s.opens}</b></div><div class="kpi"><span>Confirmed bookings</span><b>${s.bookings}</b><i>${conv.toFixed(1)}% of opens</i></div><div class="kpi"><span>Booking value</span><b>${money(s.value)}</b></div></div>
    <div class="grid g2">
    <div class="card"><div class="hd"><h2>Option 1: import your booking widget</h2>${b.mode==='widget'?'<span class="chip live">In use</span>':''}</div>
      <div>Paste the embed code from your booking system. It opens inside the app, so travellers never leave, and we see when the booking is confirmed.</div>
      <label class="f">Widget embed code<textarea class="i" id="bcode" placeholder="Paste from Rezdy, FareHarbor, Bokun, Checkfront, TrekkSoft, Peek or Xola" style="font-family:monospace;font-size:12px">${esc(b.mode==='widget'?b.code:'')}</textarea></label>
      ${b.mode==='widget'&&b.provider?`<div class="muted">Detected: <b>${esc(b.provider)}</b></div>`:''}
      <button class="btn" data-act="savewidget" style="align-self:flex-start">Use this widget</button>
      <div class="muted">How we see confirmed bookings: the app watches for your system's confirmation page inside the in-app browser. Rezdy and FareHarbor can also send us a booking webhook for exact values.</div></div>
    <div class="card"><div class="hd"><h2>Option 2: send them to your website</h2>${b.mode==='link'?'<span class="chip live">In use</span>':''}</div>
      <div>Prefer your own booking page? Add the link. We send travellers through a tracked link so every click is counted.</div>
      <label class="f">Your booking page<input class="i" id="burl" value="${esc(b.mode==='link'?b.url:'')}" placeholder="https://yoursite.com.au/book"></label>
      <button class="btn" data-act="savelink" style="align-self:flex-start">Use this page</button>
      ${b.mode==='link'?`<div class="eway"><div><b>Your tracked link</b><br><code>${esc(trackLink(v))}</code></div><div class="muted">It forwards to your page with <code>?utm_source=ultimate_perks&amp;perks_ref=…</code> on the end, so it also shows up in your Google Analytics.</div></div>
      <div><b>Count confirmed bookings</b> (pick one)</div>
      <div class="muted">1. Add this line to your booking confirmation or thank-you page:</div>
      <code style="display:block;background:#F4F8F8;border:1px solid var(--line);border-radius:10px;padding:10px;font-size:12px;white-space:pre-wrap">&lt;script src="https://perks.ultimate.travel/t.js" data-venue="${v.id}" data-event="booking" data-value="BOOKING_TOTAL"&gt;&lt;/script&gt;</code>
      <div class="muted">2. Or give Perks travellers a promo code at checkout, e.g. <b>PERKS-${esc(initials(v.name))}</b>, and we match the bookings from your monthly report.</div>`:''}</div></div>
    ${b.mode?`<button class="btn danger" data-act="clearbook" style="align-self:flex-start">Turn off bookings in the app</button>`:''}`}
  case 'redeem':return`<div class="card" style="max-width:520px"><h2>Check a voucher</h2><div class="muted">The traveller's code changes every 15 seconds. Type it in, or scan the QR on their screen.</div><label class="f">Code on their screen<input class="i" id="vc" maxlength="6" placeholder="e.g. 4KX7Q2" style="font:900 22px Work Sans;letter-spacing:.2em;text-transform:uppercase"></label><div class="row"><button class="btn" data-act="redeem">Check code</button><button class="btn ghost" data-act="scan">Scan QR</button></div></div>`;
  case 'locations':{const b=B(v.brandId);const st=DB.settings;
    if(!b) return`<div class="card" style="max-width:720px"><h2>Are you in more than one location?</h2>

      <button class="btn mint" data-act="mkbrand" style="align-self:flex-start">I'm in multiple locations</button></div>`;

    <div class="card"><div class="hd"><div><h2>${esc(b.name)}</h2><div class="muted">${locs.length} location${locs.length>1?'s':''} · Brand page: perks.ultimate.travel/brand/${esc(b.id)}</div></div><div class="row"><button class="btn ghost" data-act="editbrand">Edit brand</button><button class="btn mint" data-act="addloc">+ Add a location · ${money(st.extraLocation)}/yr</button></div></div>
      <div class="muted">Each location has its own offers, hours and voucher checks. Use "Copy to all" on an offer to roll a deal out everywhere.</div></div>
    <div class="tw"><table class="tbl"><tr><th>Location</th><th>Town</th><th>Status</th><th>Profile</th><th>Listing ends</th><th>Used · mth</th><th></th></tr>
    ${locs.map(x=>`<tr><td><div class="row" style="flex-wrap:nowrap">${av(x)}<b>${esc(x.name)}</b>${x.id===v.id?' <span class="chip mint">You are here</span>':''}</div></td><td>${esc(TOWN(x.town))}</td><td>${chip(x.status)}</td><td>${pbar(comp(x).pct)}</td><td>${expChip(x.expires)}</td><td>${x.stats.uses}</td><td>${x.id===v.id?'':`<button class="btn sm ghost" data-act="switchloc" data-id="${x.id}">Manage</button>`}</td></tr>`).join('')}</table></div>

  case 'billing':{const mine=DB.tx.filter(t=>t.vid===v.id);return`
    <div class="grid g2">

      <button class="btn" data-act="renew" style="align-self:flex-start">Renew now</button></div>
    <div class="card"><h2>Card on file</h2>${v.card?`<div><b>${v.card.brand} •• ${v.card.last4}</b> · expires ${v.card.exp}</div><div class="muted">Stored by eWay. We only hold a token.</div>`:'<div class="warnbox">No card saved.</div>'}<button class="btn ghost" data-act="updcard" style="align-self:flex-start">${v.card?'Update card':'Add card'}</button></div></div>
    <div class="card"><h2>Invoices and receipts</h2>${mine.length?`<div class="tw"><table class="tbl"><tr><th>Date</th><th>Item</th><th>Amount</th><th>Card</th><th>Status</th><th></th></tr>${mine.map(t=>`<tr><td>${fmt(t.date)}</td><td>${esc(t.type)}</td><td>${money(t.amount)}</td><td>${esc(t.method)}</td><td>${chip(t.status)}</td><td><button class="btn sm ghost" data-act="receipt" data-id="${t.id}">Receipt</button></td></tr>`).join('')}</table></div>`:'<div class="muted">No payments yet.</div>'}</div>`}

function reports(){const t=S.tab||'exp';const st=DB.settings;

  if(t==='adv'){const rows=DB.venues.filter(v=>v.status==='live').map(v=>{const c=comp(v).pct,conv=v.stats.views?v.stats.uses/v.stats.views:0;const reasons=[];if(c<80)reasons.push(`Profile ${c}%`);if(v.stats.views<600)reasons.push('Low views');if(conv<.02)reasons.push('Few redemptions');if(!(v.featuredUntil>NOW))reasons.push('Not featured');if(!DB.pushes.some(p=>p.vid===v.id))reasons.push('Never pushed');return{v,c,conv,reasons,score:reasons.length}}).sort((a,b)=>b.score-a.score||a.v.stats.uses-b.v.stats.uses);
    body=`<div class="note">Scored on profile completeness, views, redemption rate, and whether they've ever been featured or pushed. Top of the list = best people to call about a boost.</div>
    <div class="row" style="justify-content:space-between"><h2>Upsell list</h2><button class="btn ghost" data-act="csvadv">Download CSV</button></div>
    <div class="tw"><table class="tbl"><tr><th>Venue</th><th>Town</th><th>Views</th><th>Used</th><th>Rate</th><th>Why</th><th></th></tr>${rows.map(r=>`<tr><td><b>${esc(r.v.name)}</b></td><td>${esc(TOWN(r.v.town))}</td><td>${r.v.stats.views}</td><td>${r.v.stats.uses}</td><td>${(r.conv*100).toFixed(1)}%</td><td>${r.reasons.map(x=>`<span class="chip pending">${x}</span>`).join(' ')||'<span class="chip live">Doing well</span>'}</td><td><div class="row" style="flex-wrap:nowrap"><button class="btn sm ghost" data-act="chase" data-id="${r.v.id}" data-k="stats">Send stats</button>${r.v.card?`<button class="btn sm" data-act="charge" data-id="${r.v.id}" data-item="featured">Sell featured</button>`:''}</div></td></tr>`).join('')}</table></div>`;}
  if(t==='use'){const rows=DB.venues.map(v=>({v,u:v.stats.uses})).sort((a,b)=>b.u-a.u);const tot=rows.reduce((a,r)=>a+r.u,0)||1;
    const byTown=TOWNS.map(k=>[TOWN(k),DB.venues.filter(v=>v.town===k).reduce((a,v)=>a+v.stats.uses,0)]);const byCat=['Bar','Restaurant','Activity','Free'].map(c=>[c,DB.venues.filter(v=>v.cat===c).reduce((a,v)=>a+v.stats.uses,0)]);
    const months=[0,1,2,3,4,5].map(i=>DB.venues.reduce((a,v)=>a+v.stats.months[i],0));
    const hb=(arr)=>{const mx=Math.max(1,...arr.map(x=>x[1]));return arr.map(([n,c])=>`<div class="row" style="flex-wrap:nowrap"><span style="width:120px;font-size:13px">${esc(n)}</span><div class="bar" style="flex:1;height:12px"><i style="width:${c/mx*100}%"></i></div><b style="width:40px;text-align:right">${c}</b></div>`).join('')};
    body=`<div class="grid g2"><div class="card"><h2>All perks used, last 6 months</h2>${monthBars(months)}</div><div class="card"><h2>By stop</h2>${hb(byTown)}</div><div class="card"><h2>By category</h2>${hb(byCat)}</div><div class="card"><h2>Top 5 this month</h2>${hb(rows.slice(0,5).map(r=>[r.v.name,r.u]))}</div></div>
    <div class="row" style="justify-content:space-between"><h2>Every perk</h2><button class="btn ghost" data-act="csvuse">Download CSV</button></div>
    <div class="tw"><table class="tbl"><tr><th>Venue</th><th>Offer</th><th>Town</th><th>Views</th><th>Saves</th><th>Used · mth</th><th>Share</th><th>6-month trend</th></tr>${rows.map(({v,u})=>{const mx=Math.max(1,...v.stats.months);return`<tr><td><b>${esc(v.name)}</b></td><td>${esc(v.offers[0]?.t||'')}</td><td>${esc(TOWN(v.town))}</td><td>${v.stats.views}</td><td>${v.stats.saves}</td><td>${u}</td><td>${(u/tot*100).toFixed(1)}%</td><td><span style="display:inline-flex;gap:2px;align-items:flex-end;height:22px">${v.stats.months.map(n=>`<i style="display:inline-block;width:6px;height:${Math.max(2,n/mx*22)}px;background:#4ECAC2;border-radius:2px"></i>`).join('')}</span></td></tr>`}).join('')}</table></div>`;}
  if(t==='book'){const rows=DB.venues.filter(v=>v.booking&&v.booking.mode).sort((a,b)=>b.bstats.value-a.bstats.value);const tot=k=>rows.reduce((a,v)=>a+v.bstats[k],0);
    body=`<div class="grid g6"><div class="kpi"><span>Book now taps</span><b>${tot('taps')}</b></div><div class="kpi"><span>Pages opened</span><b>${tot('opens')}</b></div><div class="kpi"><span>Confirmed bookings</span><b>${tot('bookings')}</b></div><div class="kpi"><span>Booking value</span><b>${money(tot('value'))}</b></div></div>

    <div class="row" style="justify-content:space-between"><h2>Bookings by venue</h2><button class="btn ghost" data-act="csvbook">Download CSV</button></div>
    <div class="tw"><table class="tbl"><tr><th>Venue</th><th>Town</th><th>Method</th><th>Taps</th><th>Opened</th><th>Booked</th><th>Rate</th><th>Value</th></tr>${rows.map(v=>{const s=v.bstats;return`<tr><td><b>${esc(v.name)}</b></td><td>${esc(TOWN(v.town))}</td><td>${v.booking.mode==='widget'?`Widget · ${esc(v.booking.provider)}`:'Tracked link'}</td><td>${s.taps}</td><td>${s.opens}</td><td>${s.bookings}</td><td>${s.opens?(s.bookings/s.opens*100).toFixed(1):0}%</td><td>${money(s.value)}</td></tr>`}).join('')}</table></div>
    <div class="muted">Activities with no booking method yet: ${DB.venues.filter(v=>v.cat==='Activity'&&!(v.booking&&v.booking.mode)).map(v=>esc(v.name)).join(', ')||'none'}.</div>`;}
  if(t==='rev'){const now=new Date();const ms=[...Array(12)].map((_,i)=>{const d=new Date(now.getFullYear(),now.getMonth()-11+i,1);const sum=DB.tx.filter(x=>x.status==='Approved'&&new Date(x.date).getMonth()===d.getMonth()&&new Date(x.date).getFullYear()===d.getFullYear()).reduce((a,x)=>a+x.amount,0);return{d,sum}});const mx=Math.max(1,...ms.map(m=>m.sum));
    const due=DB.venues.filter(v=>v.status!=='draft'&&daysTo(v.expires)>=0&&daysTo(v.expires)<=90).length*st.listing;
    body=`<div class="grid g6"><div class="kpi"><span>Last 12 months</span><b>${money(ms.reduce((a,m)=>a+m.sum,0))}</b></div><div class="kpi"><span>Renewals due · 90 days</span><b>${money(due)}</b></div></div>
    <div class="card"><h2>Revenue by month</h2><div class="mbars" style="margin:18px 0 20px">${ms.map(m=>`<div style="height:${m.sum/mx*100}%"><em>${m.sum?'$'+Math.round(m.sum):''}</em><span>${m.d.toLocaleString('en-AU',{month:'short'})}</span></div>`).join('')}</div></div>
    <button class="btn ghost" data-act="csvtx" style="align-self:flex-start">Download all transactions</button>`;}
  return`<div class="tabs">${tabs.map(([k,n])=>`<button class="${k===t?'on':''}" data-act="tab" data-t="${k}">${n}</button>`).join('')}</div>${body}<div class="muted">Usage and view numbers are sample data in this test version.</div>`;
}

  updcard:()=>checkout({v:cv(),saveOnly:true}),
  buyfeat:()=>{const v=cv(),w=+$('#fw').value;checkout({v,amount:DB.settings.featuredWeek*w,desc:`Featured, ${w} week${w>1?'s':''}`,type:`Featured (${w} week${w>1?'s':''})`,onPaid:()=>{v.featuredUntil=Math.max(v.featuredUntil,NOW)+w*7*DAY;save()}})},
  buypush:()=>{const v=cv(),t=$('#pt').value.trim(),b=$('#pb').value.trim();if(!t||!b)return toast('Add a headline and a message first');const w=$('#pw').value?new Date($('#pw').value).getTime():Date.now()+36e5,a=$('#pa').value;

  flash:()=>{const v=cv();modal(`<h2>Flash deal</h2><div class="muted">A short deal that shows straight away with a countdown. Great for quiet nights.</div><label class="f">Deal<input class="i" id="ft" placeholder="Half-price jugs until 7pm"></label><label class="f">Terms<input class="i" id="fterm" placeholder="Show the app at the bar"></label><label class="f">Runs for<select class="i" id="fh"><option value="2">2 hours</option><option value="4" selected>4 hours</option><option value="8">8 hours</option><option value="24">24 hours</option></select></label><label class="row" style="gap:8px"><input type="checkbox" id="fpush"> Also push it to ${inTown(v.town)} travellers in ${esc(TOWN(v.town))} (${money(DB.settings.push)})</label><div class="row" style="justify-content:flex-end"><button class="btn ghost" data-act="close">Cancel</button><button class="btn mint" id="fgo">Go live</button></div>`);
    $('#fgo').onclick=()=>{const tt=$('#ft').value.trim();if(!tt)return toast('Add the deal first');const wantPush=$('#fpush').checked;const o={id:uid('O'),t:tt,terms:$('#fterm').value.trim(),when:null,paused:false,flashUntil:Date.now()+$('#fh').value*36e5};v.offers.unshift(o);save();closeModal();logA(`Flash deal live: ${v.name}`);
      if(wantPush)checkout({v,amount:DB.settings.push,desc:'Push: '+tt,type:'Push notification',onPaid:()=>{DB.pushes.unshift({id:uid('P'),title:tt.slice(0,40),body:o.terms||'Show the app to claim.',aud:'in:'+v.town,vid:v.id,when:Date.now(),status:'Awaiting approval',reach:0,opens:0,paid:'Venue '+money(DB.settings.push)});save()}});

  sendpush:()=>{const t=$('#pt').value.trim(),b=$('#pb').value.trim();if(!t||!b)return toast('Add a headline and message');const a=$('#pa').value,vid=$('#pv').value,w=$('#pw').value?new Date($('#pw').value).getTime():Date.now(),bill=$('#pbill').value;const n=audCount(a);
    const go=paid=>{DB.pushes.unshift({id:uid('P'),title:t,body:b,aud:a,vid,when:w,status:w>Date.now()+6e4?'Scheduled':'Sent',reach:n,opens:Math.round(n*.3),paid});logA(`Push to ${n} members: ${t}`);save();toast(`Push ${w>Date.now()+6e4?'scheduled':'sent'} to ${n} members (test)`);render()};
    if(bill==='charge'){const v=V(vid);if(!v||!v.card)return toast('Pick a venue with a saved card');confirmBox('Send and charge?',`Send to <b>${n}</b> members and charge ${esc(v.name)} ${money(DB.settings.push)} on ${v.card.brand} •• ${v.card.last4}?`,'Send and charge',()=>{DB.tx.unshift({id:'EW'+Math.floor(10240000+Math.random()*9e4),date:Date.now(),vid:v.id,type:'Push notification',amount:DB.settings.push,status:'Approved',method:`${v.card.brand} •• ${v.card.last4}`});go('Venue '+money(DB.settings.push))})}
    else confirmBox('Send push?',`Send to <b>${n}</b> members: "${esc(t)}"`,'Send',()=>go('House'))},
  addfeat:()=>{modal(`<h2>Feature a venue</h2><label class="f">Venue<select class="i" id="fv">${DB.venues.filter(v=>v.status==='live').map(v=>`<option value="${v.id}">${esc(v.name)}</option>`).join('')}</select></label><label class="f">Weeks<input class="i" type="number" id="fwk" value="1" min="1"></label><label class="row" style="gap:8px"><input type="checkbox" id="fch"> Charge their saved card</label><div class="row" style="justify-content:flex-end"><button class="btn ghost" data-act="close">Cancel</button><button class="btn" id="fgo2">Feature</button></div>`);
    $('#fgo2').onclick=()=>{const v=V($('#fv').value),w=+$('#fwk').value||1;if($('#fch').checked){if(!v.card)return toast('No card saved');DB.tx.unshift({id:'EW'+Math.floor(10240000+Math.random()*9e4),date:Date.now(),vid:v.id,type:`Featured (${w} week${w>1?'s':''})`,amount:DB.settings.featuredWeek*w,status:'Approved',method:`${v.card.brand} •• ${v.card.last4}`})}v.featuredUntil=Math.max(v.featuredUntil,NOW)+w*7*DAY;logA(`Featured ${v.name} for ${w} weeks`);save();closeModal();render()}},
  extfeat:d=>{V(d.id).featuredUntil+=7*DAY;save();render()},
  endfeat:d=>confirmBox('End featured now?','They drop out of the Featured slider straight away.','End',()=>{V(d.id).featuredUntil=0;save();render()},true),
  rev:d=>{DB.reviews[+d.i].ok=!DB.reviews[+d.i].ok;save();render()},
  pullnow:()=>{DB.content.pulled=new Date().toLocaleDateString('en-AU',{day:'numeric',month:'short',year:'numeric'});save();toast('Pull queued. The live build fetches every council feed');render()},
  addadmin:()=>{modal(`<h2>Add admin</h2><label class="f">Name<input class="i" id="an"></label><label class="f">Email<input class="i" id="ae" type="email"></label><label class="f">Role<select class="i" id="ar"><option>Admin</option><option>Support</option></select></label><div class="row" style="justify-content:flex-end"><button class="btn ghost" data-act="close">Cancel</button><button class="btn" id="ago">Send invite</button></div>`);$('#ago').onclick=()=>{if(!$('#an').value)return;DB.settings.admins.push({n:$('#an').value,e:$('#ae').value,role:$('#ar').value});save();closeModal();render()}},
  resetdemo:()=>confirmBox('Reset test data?','Puts all venues, members and payments back to the starting sample.','Reset',()=>{DB=seedData();save();render()},true),
  csvvenues:()=>csv('perks-venues.csv',[['Venue','Brand','Town','Category','Status','Profile %','Missing','Listing ends','Days left','Auto-renew','Card','Featured until','Views','Saves','Used this month','Contact','Email'],...DB.venues.map(v=>{const c=comp(v);return[v.name,B(v.brandId)?.name||'',TOWN(v.town),v.cat,v.status,c.pct,c.missing.map(i=>i.k).join(' '),fmt(v.expires),daysTo(v.expires),v.autoRenew?'Yes':'No',v.card?`${v.card.brand} ${v.card.last4}`:'None',v.featuredUntil?fmt(v.featuredUntil):'',v.stats.views,v.stats.saves,v.stats.uses,v.contact.n,v.contact.e]})]),
  csvexp:()=>csv('perks-expiries.csv',[['Venue','Town','Email','Listing ends','Days left','Renewal','Featured ends','Last push'],...DB.venues.filter(v=>v.status!=='draft').sort((a,b)=>a.expires-b.expires).map(v=>{const lp=DB.pushes.filter(p=>p.vid===v.id).sort((a,b)=>b.when-a.when)[0];return[v.name,TOWN(v.town),v.contact.e,fmt(v.expires),daysTo(v.expires),v.card&&v.autoRenew?'Auto':'Manual',v.featuredUntil?fmt(v.featuredUntil):'',lp?fmt(lp.when):'']})]),
  csvadv:()=>csv('perks-upsell-list.csv',[['Venue','Town','Profile %','Views','Used','Rate %','Featured now','Ever pushed','Email'],...DB.venues.filter(v=>v.status==='live').map(v=>[v.name,TOWN(v.town),comp(v).pct,v.stats.views,v.stats.uses,(v.stats.views?v.stats.uses/v.stats.views*100:0).toFixed(1),v.featuredUntil>NOW?'Yes':'No',DB.pushes.some(p=>p.vid===v.id)?'Yes':'No',v.contact.e])]),
  csvuse:()=>{const now=new Date();const mh=[0,1,2,3,4,5].map(i=>new Date(now.getFullYear(),now.getMonth()-5+i,1).toLocaleString('en-AU',{month:'short',year:'2-digit'}));csv('perks-usage.csv',[['Venue','Offer','Town','Category','Views','Saves',...mh],...DB.venues.map(v=>[v.name,v.offers[0]?.t||'',TOWN(v.town),v.cat,v.stats.views,v.stats.saves,...v.stats.months])])},
  csvtx:()=>csv('perks-transactions.csv',[['Date','eWay ID','Venue','Item','Amount','Card','Status'],...DB.tx.map(t=>[fmt(t.date),t.id,V(t.vid)?.name||'',t.type,t.amount.toFixed(2),t.method,t.status])]),
  csvmembers:()=>csv('perks-members.csv',[['Name','Email','Booking','Tour','Now in','Next stop','Arrives','Signed in with','Perks used','Saved','Status'],...DB.members.map(m=>[m.n,m.e,m.ref,m.tour,TOWN(m.town),TOWN(m.next),fmt(m.arrive),m.via,m.used,m.saved,m.status])]),
  csvpush:()=>csv('perks-pushes.csv',[['Headline','Message','Audience','Venue','When','Status','Reached','Opened','Paid'],...DB.pushes.map(p=>[p.title,p.body,audLabel(p.aud),V(p.vid)?.name||'House',fmtT(p.when),p.status,p.reach,p.opens,p.paid])]),
};
document.addEventListener('click',e=>{if(e.target.closest('[data-home]')&&window.parent!==window){e.preventDefault();window.parent.__closePortal();return}const a=e.target.closest('[data-act]');if(!a)return;const f=act[a.dataset.act];if(f){e.preventDefault();f(a.dataset,a)}});
document.addEventListener('input',e=>{const t=e.target;
  if(t.id==='pt'&&$('#pvt'))$('#pvt').textContent=t.value||'Happy hour starts now';
  if(t.id==='pb'&&$('#pvb'))$('#pvb').textContent=t.value||'Half-price jugs until 7pm. Show the app.';
  if(t.matches('[data-q]')){S.q=t.value;const pos=t.selectionStart;render();const n=$('[data-q]');n.focus();n.setSelectionRange(pos,pos)}});
document.addEventListener('change',e=>{const t=e.target,v=cv();
  if(t.matches('[data-f]')){v[t.dataset.f]=t.value;save();render();toast('Saved')}
  if(t.matches('[data-c]')){v.contact[t.dataset.c]=t.value;save();toast('Saved')}
  if(t.matches('[data-h]')){const d=t.dataset.h;v.hours[d]=v.hours[d]||['',''];v.hours[d][+t.dataset.w]=t.value;save()}
  if(t.matches('[data-closed]')){const d=t.dataset.closed;if(t.checked)delete v.hours[d];else v.hours[d]=['11:00','22:00'];save();render()}
  if(t.matches('[data-em]')){v.emails[t.dataset.em]=t.checked;save();toast('Saved')}
  if(t.matches('[data-act2=autorenew]')){v.autoRenew=t.checked;save();render()}
  if(t.matches('[data-ft]')){S.ftown=t.value;render()}
  if(t.matches('[data-fs]')){S.fstatus=t.value;render()}
  if(t.matches('[data-auto]')){DB.autos.find(a=>a.k===t.dataset.auto).on=t.checked;save();toast('Saved')}
  if(t.matches('[data-subj]')){DB.autos.find(a=>a.k===t.dataset.subj).subj=t.value;save();render()}
  if(t.matches('[data-pv]')){S.prevVenue=t.value;render()}
  if(t.matches('[data-importcsv]')){const f=t.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{const rows=parseCSV(rd.result);const h=rows.shift().map(x=>x.trim().toLowerCase());const col=n=>h.indexOf(n);let n=0,skip=0;
    rows.forEach(r=>{const name=(r[col('name')]||'').trim();if(!name)return;const tw=TOWNS.find(k=>TOWN(k).toLowerCase().startsWith((r[col('town')]||'').trim().toLowerCase().split(' /')[0]))||'';if(DB.venues.some(v=>v.name.toLowerCase()===name.toLowerCase()&&v.town===tw)){skip++;return}
      DB.venues.push({id:'P'+Date.now()+n,name,town:tw,cat:r[col('type in app')]||'Bar',addr:r[col('address')]||'',lat:r[col('latitude')]||'',lon:r[col('longitude')]||'',logo:'',photos:[],desc:'',phone:'',web:r[col('website')]||'',book:'',insta:'',hours:{},hoursReal:false,offers:[{id:uid('O'),t:r[col('placeholder offer')]||'Save 10%',terms:'Placeholder offer. Confirm before going live.',when:null,paused:false,flashUntil:0}],contact:{n:'',e:''},status:'prospect',priority:/yes/i.test(r[col('priority')]||''),suggested:r[col('suggested deal')]||'',category:r[col('category')]||'',expires:Date.now(),autoRenew:false,card:null,featuredUntil:0,booking:{mode:'',url:'',code:'',provider:''},bstats:{taps:0,opens:0,bookings:0,value:0},emails:{profile:true,monthly:true,stats:true},notes:'Imported from CSV',joined:Date.now(),brandId:((DB.brands||[]).find(b=>b.name.toLowerCase()===(r[col('brand')]||'').trim().toLowerCase())||{}).id||'',stats:{views:0,saves:0,uses:0,months:[0,0,0,0,0,0]}});n++});
    logA(`Imported ${n} venues from CSV`);save();toast(n+' imported as prospects'+(skip?`, ${skip} already in the system skipped`:''));render()};rd.readAsText(f);return}
  if(t.matches('[data-locsw]')){if(S.role==='admin')S.viewAs=t.value;else S.venueId=t.value;render();return}
  if(t.matches('[data-promo]')){DB.settings.promos[+t.dataset.promo].active=t.checked;save();toast('Saved')}
  if(t.matches('[data-set]')){const k=t.dataset.set;DB.settings[k]=t.type==='checkbox'?t.checked:t.type==='number'?+t.value:t.value;save();toast('Saved')}
  if(t.matches('[data-up]')){const files=[...t.files];const kind=t.dataset.up;
    files.slice(0,kind==='logo'?1:8-v.photos.length).forEach(f=>{const rd=new FileReader();rd.onload=()=>{const img=new Image();img.onload=()=>{const mx=kind==='logo'?400:1000,s=Math.min(1,mx/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=img.width*s;c.height=img.height*s;c.getContext('2d').drawImage(img,0,0,c.width,c.height);const u=c.toDataURL(kind==='logo'?'image/png':'image/jpeg',.82);if(kind==='logo')v.logo=u;else v.photos.push(u);save();render()};img.src=rd.result};rd.readAsDataURL(f)})}
});
render();
</script>
<script>
// // live sign-in: role comes from the profiles table (admin or venue)
window.addEventListener('perksauth:ready',()=>{ if(!window.PerksAuth||!PerksAuth.live) return; render();
  PerksAuth.onChange((u,prof)=>{ if(!u){ if(S.role){S.role=null;render()} return; }
    if(!prof||!prof.role||prof.role==='traveller'){ toast('This account is not set up as a venue or admin yet'); return; }
    S.role=prof.role==='admin'?'admin':'venue'; if(prof.venue_id) S.venueId=prof.venue_id; S.page='dash'; render(); });
});
</script>
